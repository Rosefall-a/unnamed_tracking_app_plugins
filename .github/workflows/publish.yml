name: Publish plugin packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build signed packages
        env:
          PLUGIN_SIGNING_KEY_B64: ${{ secrets.PLUGIN_SIGNING_KEY_B64 }}
          PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
        run: python tools/build_packages.py
      - name: Upload packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.utp --clobber
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unnamed-tracking-example-plugins
          path: dist/*.utp
          if-no-files-found: error
