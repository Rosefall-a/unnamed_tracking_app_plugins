name: Build plugin packages on main pushes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Build installable plugin packages
        env:
          PLUGIN_SIGNING_KEY_B64: ${{ secrets.PLUGIN_SIGNING_KEY_B64 }}
          PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
        run: python tools/build_packages.py

      - name: Verify generated packages
        run: python tools/verify_packages.py dist/*.utp

      - name: Upload generated .utp packages
        uses: actions/upload-artifact@v4
        with:
          name: plugin-packages-main-${{ github.sha }}
          path: dist/*.utp
          if-no-files-found: error
          retention-days: 7
