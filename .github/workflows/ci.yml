name: Example plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest cryptography
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/session_manager_ui.test.mjs
      - run: node --check examples/self-service-session-manager/frontend/app.js
      - run: pytest
      - run: python tools/build_packages.py
      - run: python tools/verify_packages.py dist/*.utp
      - run: python tools/validate_packages.py dist/*.utp
