<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfin Media Sync</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>Jellyfin Media Sync</h1><p>Credentials are saved as write-only plugin secrets and are never displayed again.</p><label>Jellyfin server URL <input id="server" type="url" placeholder="https://jellyfin.example"></label><label>Jellyfin user ID or username <input id="user"></label><label>API key <input id="api-key" type="password" autocomplete="new-password"></label><label>Password <input id="password" type="password" autocomplete="new-password"></label><label><input id="background" type="checkbox"> Enable 15-minute background sync</label><button id="save">Save settings</button><div class="actions"><button id="sync">Sync Now</button><button id="events">Refresh activity</button></div><p id="status" role="status"></p><pre id="output"></pre></main><script src="./app.js"></script></body></html>
