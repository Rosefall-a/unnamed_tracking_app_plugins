<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discord Delivery Provider</title>
  <link rel="stylesheet" href="./appearance.css" />
    <link rel="stylesheet" href="./style.css">
  <script src="./appearance.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Discord delivery</h1><p>Core controls eligibility, preferences, attempts, backoff, and terminal delivery state.</p></header>
    <section>
      <label for="webhook">Discord webhook URL</label>
      <input id="webhook" type="password" autocomplete="new-password" placeholder="https://discord.com/api/webhooks/…">
      <div class="actions"><button id="save" type="button">Save secret</button><button id="check" type="button">Check configuration</button></div>
      <p>The destination is never returned to this page after saving. Enable “Discord (plugin)” in Notification Providers after the plugin registers it.</p>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
